name: CLA

# The Contributor License Agreement (.github/CLA.md, CONTRIBUTING.md): the
# CLA Assistant action asks the author of a pull request to sign it with a
# comment, and records the signature in this repository, on the
# `cla-signatures` branch. pull_request_target runs this workflow as it is
# on the base branch, with a token that can write: it never checks out or
# runs the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/.github/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: sinkingsugar,dependabot[bot],github-actions[bot]
