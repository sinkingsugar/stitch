[package]
name = "stitch-net"
description = "The node protocol over iroh: record sync and blob fetch between nodes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
data-encoding = "2.11.1"
iroh = "1.3.0"
futures-util = "0.3.34"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
stitch-records = { version = "0.1.0", path = "../stitch-records" }
stitch-store = { version = "0.1.0", path = "../stitch-store" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
