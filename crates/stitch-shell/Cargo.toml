[package]
name = "stitch-shell"
description = "Interactive shell sessions: PTYs on the async runtime, a terminal emulator, exact command state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pty-process = { version = "0.5.3", features = ["async"] }
libc = "0.2.190"
rand = "0.10.3"
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["termios", "process", "pty"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "sync", "time", "io-util", "process", "macros"] }
vt100 = "0.18"
vte = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
libc = "0.2.190"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
