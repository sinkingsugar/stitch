[package]
name = "stitch-records"
description = "Stitch's record format: IDs, references, records and transcript segments"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
jiff = { version = "0.2.38", features = ["serde"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.153", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
