[package]
name = "stitch-cli"
description = "Development CLI over the Stitch store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "stitch"
path = "src/main.rs"

# Forks shells for the node on macOS (stitch-shell's helper); installed
# next to `stitch`, where the node looks for it.
[[bin]]
name = "stitch-shell-helper"
path = "src/shell_helper.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29"
iroh = "1.3.0"
jiff = "0.2.38"
libc = "0.2.190"
qrcode = { version = "0.14.1", default-features = false }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stitch-net = { version = "0.1.0", path = "../stitch-net" }
stitch-node = { version = "0.1.0", path = "../stitch-node" }
stitch-discord = { version = "0.1.0", path = "../stitch-discord" }
stitch-providers = { version = "0.1.0", path = "../stitch-providers" }
stitch-proxy = { version = "0.1.0", path = "../stitch-proxy" }
stitch-records = { version = "0.1.0", path = "../stitch-records" }
stitch-shell = { version = "0.1.0", path = "../stitch-shell" }
stitch-store = { version = "0.1.0", path = "../stitch-store" }
stitch-vault = { version = "0.1.0", path = "../stitch-vault" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.1.8"
unicode-width = "0.2.2"

[dev-dependencies]
alacritty_terminal = "0.26.0"
libc = "0.2.190"
tempfile = "3.27.0"
