[package]
name = "stitch-store"
description = "Record roots, the blob store, the local index and record sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
jiff = "0.2.38"
rand = "0.10.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
stitch-records = { version = "0.1.0", path = "../stitch-records" }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
