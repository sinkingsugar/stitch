[package]
name = "stitch-proxy"
description = "A key-holding proxy for model APIs: per-client tokens, daily budgets, rate limits, usage counted from responses"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jiff = "0.2.38"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
stitch-providers = { version = "0.1.0", path = "../stitch-providers" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
