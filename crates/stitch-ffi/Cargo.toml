[package]
name = "stitch-ffi"
description = "The node for the iOS and visionOS app: in process, through UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The Swift bindings' generator, run on the Mac by the app's build.
bindgen = ["uniffi/cli"]

[dependencies]
walkdir = "2.5.0"
jiff = "0.2.38"
stitch-net = { version = "0.1.0", path = "../stitch-net" }
stitch-node = { version = "0.1.0", path = "../stitch-node" }
stitch-providers = { version = "0.1.0", path = "../stitch-providers" }
stitch-records = { version = "0.1.0", path = "../stitch-records" }
stitch-store = { version = "0.1.0", path = "../stitch-store" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time"] }
uniffi = "0.32.2"

[dev-dependencies]
stitch-memory = { version = "0.1.0", path = "../stitch-memory" }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt"] }
