[package]
name = "stitch-vault"
description = "Experimental encrypted vault protocol and inert recovery client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
thiserror = "2.0.21"
zeroize = "1.8.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
futures-util = "0.3.34"
tokio = { version = "1.53.2", features = ["time"] }
fastcdc = "5"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }

stitch-records = { version = "0.1.0", path = "../stitch-records" }
stitch-store = { version = "0.1.0", path = "../stitch-store" }

[dev-dependencies]
jiff = "0.2.38"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
