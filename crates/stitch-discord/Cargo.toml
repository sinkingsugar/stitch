[package]
name = "stitch-discord"
description = "A Discord bridge to a Stitch node: channels and threads to Stitch threads"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stitch-node = { version = "0.1.0", path = "../stitch-node" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "twilight-http", "zlib"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = "0.17.1"

[dev-dependencies]
stitch-proxy = { version = "0.1.0", path = "../stitch-proxy" }
stitch-store = { version = "0.1.0", path = "../stitch-store" }
tempfile = "3.27.0"
