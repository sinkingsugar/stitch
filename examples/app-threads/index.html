<!doctype html>
<html>
<head>
  <title>Studio</title>
  <link rel="stylesheet" href="/_stitch/stitch.css">
  <style>
    body { margin: 0; font: 15px/1.4 -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    .muted { color: var(--fg2); font-size: 13px; }
    main { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 54px); }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } #side.hidden-small { display: none; } }
    #side { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .project { padding: 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--bg2); }
    .project.on { border-color: var(--accent); }
    .project b { display: block; }
    .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--line); }
    .badge.working { background: #2b6cb0; color: #fff; }
    .badge.approval { background: #c05621; color: #fff; }
    .badge.idle { background: #2f855a; color: #fff; }
    #grant { margin: 12px 16px; padding: 12px; border-radius: 10px; background: #fff3cd; color: #533f03; display: none; }
    #grant code { display: block; margin: 8px 0; padding: 6px; background: rgba(0,0,0,.06); border-radius: 6px; word-break: break-all; }
    #view { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
    #stage { height: 180px; border-bottom: 1px solid var(--line); }
    #log { overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 54px - 180px - 90px); }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
    .msg.assistant { align-self: flex-start; background: var(--bg2); border: 1px solid var(--line); }
    .msg.tool { align-self: flex-start; color: var(--fg2); font-size: 12px; padding: 0 12px; }
    .msg img { max-width: 220px; display: block; margin-top: 6px; border-radius: 8px; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    input[type=text], textarea { flex: 1; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    button.plain { background: transparent; color: var(--fg2); border: 1px solid var(--line); }
    #error { color: #c53030; padding: 0 16px; min-height: 1em; font-size: 13px; }
    #empty { padding: 24px; color: var(--fg2); }
  </style>
</head>
<body>
  <header>
    <h1>Studio</h1>
    <span class="muted" id="spend"></span>
    <button id="new">New project</button>
  </header>
  <div id="grant"></div>
  <div id="error"></div>
  <main>
    <div id="side"><div class="muted" id="none">No projects yet.</div></div>
    <div id="view">
      <div id="stage"></div>
      <div id="log"><div id="empty">Pick a project, or start a new one: describe the garment, attach a sketch if you have one.</div></div>
      <form id="say">
        <input type="text" id="text" placeholder="Say something to this project's agent" autocomplete="off">
        <input type="file" id="pick" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        <button type="button" class="plain" id="attach">Image</button>
        <button id="send">Send</button>
        <button type="button" class="plain" id="stop">Stop</button>
      </form>
    </div>
  </main>
  <script src="app.js"></script>
  <script type="module" src="stage.js"></script>
</body>
</html>
